name: Prepare clip preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt

      - name: Prepare one clip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python autopilot.py --slot vertical_clip --dry-run

      - name: Save clip for download
        uses: actions/upload-artifact@v4
        with:
          name: clip-preview
          path: work/ready/**/*.mp4
          if-no-files-found: error
